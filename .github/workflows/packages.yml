name: Build and publish Windows packages

on:
  push:
    branches: [main]
    tags: ['v*.*.*.*']

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate branch, tag and version
        id: version
        run: python scripts/release_metadata.py --check-main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft bridge and redistributable dependencies
        working-directory: minecraft
        run: ./gradlew.bat build copyReleaseMods '-Pversion=${{ steps.version.outputs.mod_version }}' --no-daemon --console=plain
      - name: Build native bridge and run targeted tests
        run: |
          python -m pip install numpy
          python scripts/build_native.py
          python -m unittest discover -s tests -v
      - name: Assemble versioned packages
        run: python scripts/package_release.py
      - name: Validate package contents and packaged DLL
        run: python scripts/verify_package.py
      - name: Install and enable packaged add-on in Blender
        run: python scripts/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.stem }}
          path: |
            dist/*.zip
            dist/*.mrpack
            dist/SHA256SUMS.txt
            dist/build-info.json
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
