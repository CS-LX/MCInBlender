name: Build and publish Windows packages

on:
  push:
    branches: [main]
    tags: ['v*.*.*.*']

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate branch, tag and version
        id: version
        run: python scripts/release_metadata.py --check-main
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build Minecraft bridge and redistributable dependencies
        working-directory: minecraft
        run: ./gradlew.bat build copyReleaseMods '-Pversion=${{ steps.version.outputs.mod_version }}' --no-daemon --console=plain
      - name: Build native bridge and run targeted tests
        run: |
          python -m pip install numpy
          python scripts/build_native.py
          python -m unittest discover -s tests -v
      - name: Assemble versioned packages
        run: python scripts/package_release.py
      - name: Validate package contents and packaged DLL
        run: python scripts/verify_package.py
      - name: Install and enable packaged add-on in Blender
        run: python scripts/smoke_install.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.stem }}
          path: |
            dist/*.zip
            dist/*.mrpack
            dist/SHA256SUMS.txt
            dist/build-info.json
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
